# Docker Compose configuration for Plexo multi-agent system
version: '3.8'

services:
  # PostgreSQL - Relational database
  postgres:
    image: postgres:16-alpine
    container_name: plexo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plexo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plexo_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-plexo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plexo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plexo-network

  # Redis - Cache and session storage
  redis:
    image: redis:7-alpine
    container_name: plexo-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-plexo_redis_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plexo-network

  # RabbitMQ - Message queue for async tasks
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: plexo-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plexo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plexo_rabbitmq_password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plexo}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - plexo-network

  # Prosody - XMPP server for SPADE agents
  prosody:
    image: prosody/prosody:latest
    container_name: plexo-prosody
    environment:
      PROSODY_ADMINS: admin@localhost
    ports:
      - "${XMPP_CLIENT_PORT:-5222}:5222"
      - "${XMPP_SERVER_PORT:-5269}:5269"
    volumes:
      - prosody_data:/var/lib/prosody
    networks:
      - plexo-network

  # Plexo FastAPI Application
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: plexo-app
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-plexo}:${POSTGRES_PASSWORD:-plexo_dev_password}@postgres:5432/${POSTGRES_DB:-plexo}
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-plexo_redis_password}@redis:6379/0
      # RabbitMQ
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-plexo}:${RABBITMQ_PASSWORD:-plexo_rabbitmq_password}@rabbitmq:5672/${RABBITMQ_VHOST:-plexo}
      # XMPP
      XMPP_SERVER: prosody
      XMPP_PORT: 5222
      # Application
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      prosody:
        condition: service_started
    volumes:
      - ../app:/app/app
      - ../alembic:/app/alembic
    networks:
      - plexo-network
    restart: unless-stopped

  # Plexo Worker - Task processing
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: plexo-worker
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-plexo}:${POSTGRES_PASSWORD:-plexo_dev_password}@postgres:5432/${POSTGRES_DB:-plexo}
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-plexo_redis_password}@redis:6379/0
      # RabbitMQ
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-plexo}:${RABBITMQ_PASSWORD:-plexo_rabbitmq_password}@rabbitmq:5672/${RABBITMQ_VHOST:-plexo}
      # XMPP
      XMPP_SERVER: prosody
      XMPP_PORT: 5222
      # Worker
      WORKER_TYPE: ${WORKER_TYPE:-task}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      prosody:
        condition: service_started
    volumes:
      - ../app:/app/app
    networks:
      - plexo-network
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-2}

  # Prometheus - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: plexo-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - plexo-network

  # Grafana - Metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: plexo-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - plexo-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  prosody_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  plexo-network:
    driver: bridge
