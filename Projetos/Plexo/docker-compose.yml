# Docker Compose configuration for complete Plexo system
# Orchestrates backend, frontend, and all infrastructure services
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: plexo-postgres
    environment:
      POSTGRES_USER: plexo
      POSTGRES_PASSWORD: plexo_dev_password
      POSTGRES_DB: plexo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plexo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plexo-network

  redis:
    image: redis:7-alpine
    container_name: plexo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plexo-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: plexo-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: plexo
      RABBITMQ_DEFAULT_PASS: plexo_dev_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plexo-network

  ejabberd:
    image: ejabberd/ecs:latest
    container_name: plexo-ejabberd
    environment:
      ERLANG_NODE: ejabberd@localhost
      XMPP_DOMAIN: localhost
    ports:
      - "5222:5222"
      - "5269:5269"
      - "5280:5280"
    volumes:
      - ejabberd_data:/home/ejabberd
      - ./backend/docker/ejabberd/ejabberd.yml:/home/ejabberd/conf/ejabberd.yml
    networks:
      - plexo-network

  prometheus:
    image: prom/prometheus:latest
    container_name: plexo-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./backend/docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - plexo-network

  grafana:
    image: grafana/grafana:latest
    container_name: plexo-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - plexo-network

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    container_name: plexo-backend
    environment:
      DATABASE_URL: postgresql://plexo:plexo_dev_password@postgres:5432/plexo
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://plexo:plexo_dev_password@rabbitmq:5672/
      XMPP_SERVER: ejabberd
      XMPP_PORT: 5222
      XMPP_DOMAIN: localhost
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - plexo-network

  worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.worker
    container_name: plexo-worker
    environment:
      DATABASE_URL: postgresql://plexo:plexo_dev_password@postgres:5432/plexo
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://plexo:plexo_dev_password@rabbitmq:5672/
      XMPP_SERVER: ejabberd
      XMPP_PORT: 5222
      XMPP_DOMAIN: localhost
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: python scripts/run_worker.py
    networks:
      - plexo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plexo-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host
    networks:
      - plexo-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  ejabberd_data:
  prometheus_data:
  grafana_data:

networks:
  plexo-network:
    driver: bridge
